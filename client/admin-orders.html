<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="apple-touch-icon" href="/images/favicon.svg">
  <title>Manage Orders - Joy World Farm Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <a class="logo" href="/admin/dashboard">
      <span class="logo-icon" aria-hidden="true">🌱</span>
      <span>Joy World Farm Admin</span>
    </a>
    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/products">Products</a>
      <a href="/admin/orders" class="active">Orders</a>
      <a href="/admin/delivery">Delivery</a>
      <a href="/admin/enquiries">Enquiries</a>
      <a href="/" target="_blank">View Site</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main class="admin-content">
    <h1>Order Management</h1>

    <div id="orderDetail"></div>

    <h2 style="color:var(--primary); margin-bottom:15px;">All Orders</h2>
    <div class="admin-toolbar">
      <input type="search" id="orderSearch" class="form-control" placeholder="Search by reference, name, phone or city…" aria-label="Search orders">
      <select id="orderStatusFilter" class="form-control" aria-label="Filter orders by status">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Processing">Processing</option>
        <option value="Ready for collection or dispatch">Ready for collection or dispatch</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
    <p id="ordersCount" class="admin-count" aria-live="polite"></div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Reference</th><th>Customer</th><th>Phone</th><th>City</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="8">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    initAdmin('orders');
  </script>
</body>
</html>
