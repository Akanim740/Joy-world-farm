<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="apple-touch-icon" href="/images/favicon.svg">
  <title>Admin Dashboard - Joy World Farm</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <a class="logo" href="/admin/dashboard">
      <span class="logo-icon" aria-hidden="true">🌱</span>
      <span>Joy World Farm Admin</span>
    </a>
    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="/admin/dashboard" class="active">Dashboard</a>
      <a href="/admin/products">Products</a>
      <a href="/admin/orders">Orders</a>
      <a href="/admin/enquiries">Enquiries</a>
      <a href="/" target="_blank">View Site</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main class="admin-content">
    <h1>Dashboard Overview</h1>

    <div id="statsGrid" class="stat-grid" aria-live="polite">
      <div class="loading-skeleton" style="min-height:120px; grid-column:1/-1;"></div>
    </div>

    <h2 style="color:var(--primary); margin-bottom:15px;">Sales Overview</h2>
    <div id="salesGrid" class="sales-grid" aria-live="polite">
      <div class="loading-skeleton" style="min-height:110px; grid-column:1/-1;"></div>
    </div>

    <h2 style="color:var(--primary); margin-bottom:15px;">Recent Orders</h2>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Reference</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody id="recentOrdersBody">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    initAdmin('dashboard');
  </script>
</body>
</html>
