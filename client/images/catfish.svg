<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of a catfish in water">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#159a63"/>
      <stop offset="1" stop-color="#0a5d38"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6b5a"/>
      <stop offset="1" stop-color="#2c4438"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#water)"/>
  <!-- light rays -->
  <g fill="#ffffff" opacity="0.08">
    <path d="M60 0 L120 0 L60 300 L10 300 Z"/>
    <path d="M180 0 L220 0 L180 300 L150 300 Z"/>
    <path d="M300 0 L330 0 L300 300 L275 300 Z"/>
  </g>
  <!-- bubbles -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="320" cy="70" r="7"/>
    <circle cx="338" cy="48" r="4"/>
    <circle cx="305" cy="100" r="5"/>
  </g>

  <!-- fish -->
  <g transform="translate(200 160)">
    <path d="M-10 0 C -40 -34 -110 -44 -150 -20 C -118 -8 -118 8 -150 20 C -110 44 -40 34 -10 0 Z" fill="url(#fish)"/>
    <!-- tail -->
    <path d="M118 0 C 138 -26 168 -34 182 -30 C 168 -12 168 12 182 30 C 168 34 138 26 118 0 Z" fill="#2c4438"/>
    <!-- belly -->
    <path d="M-20 6 C -60 22 -110 24 -140 12 C -100 22 -50 24 -20 6 Z" fill="#c9d6cd" opacity="0.5"/>
    <!-- whiskers -->
    <g stroke="#c9d6cd" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M-140 -14 C -170 -30 -196 -34 -214 -30"/>
      <path d="M-140 14 C -170 30 -196 34 -214 30"/>
      <path d="M-140 0 C -172 4 -198 10 -214 18"/>
    </g>
    <!-- eye -->
    <circle cx="-118" cy="-8" r="9" fill="#fff"/>
    <circle cx="-116" cy="-8" r="4.5" fill="#12211a"/>
    <!-- dorsal fin -->
    <path d="M-70 -34 C -60 -56 -30 -60 -14 -46 C -34 -44 -52 -40 -70 -34 Z" fill="#3a5347"/>
    <!-- pectoral fin -->
    <path d="M-40 14 C -34 34 -14 44 0 40 C -18 34 -30 26 -40 14 Z" fill="#3a5347"/>
    <!-- side highlight -->
    <path d="M-120 -16 C -80 -28 -40 -28 -8 -18" stroke="#7f9488" stroke-width="3" fill="none" opacity="0.6"/>
  </g>

  <!-- plants -->
  <g fill="#0f7c4f" opacity="0.7">
    <path d="M40 300 C 30 250 50 220 40 190 C 60 220 62 250 56 300 Z"/>
    <path d="M360 300 C 350 256 372 228 362 200 C 382 230 382 258 376 300 Z"/>
  </g>
</svg>
