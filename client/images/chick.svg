<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of a day-old chick">
  <defs>
    <linearGradient id="chickBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#d8f0e4"/>
    </linearGradient>
    <radialGradient id="chickBody" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f2c94c"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#chickBg)"/>
  <ellipse cx="200" cy="268" rx="120" ry="16" fill="#0f7c4f" opacity="0.12"/>
  <circle cx="330" cy="60" r="34" fill="#f2d16b" opacity="0.5"/>

  <!-- body -->
  <ellipse cx="200" cy="185" rx="85" ry="72" fill="url(#chickBody)"/>
  <!-- wing -->
  <path d="M150 175 C 165 150 215 150 232 178 C 210 205 172 205 150 175 Z" fill="#e6b93f" opacity="0.85"/>
  <!-- head -->
  <circle cx="200" cy="108" r="54" fill="url(#chickBody)"/>
  <!-- beak -->
  <path d="M200 116 L 232 128 L 200 140 Z" fill="#f0a04b"/>
  <!-- eye -->
  <circle cx="182" cy="104" r="7" fill="#3b2a12"/>
  <circle cx="184" cy="102" r="2.4" fill="#fff"/>
  <!-- legs -->
  <g stroke="#f0a04b" stroke-width="7" stroke-linecap="round">
    <line x1="180" y1="248" x2="176" y2="268"/>
    <line x1="220" y1="248" x2="224" y2="268"/>
  </g>
  <g stroke="#f0a04b" stroke-width="5" stroke-linecap="round">
    <line x1="176" y1="268" x2="164" y2="274"/>
    <line x1="176" y1="268" x2="188" y2="274"/>
    <line x1="224" y1="268" x2="212" y2="274"/>
    <line x1="224" y1="268" x2="236" y2="274"/>
  </g>
  <!-- tuft -->
  <path d="M196 58 q 6 -22 20 -26 q -8 14 -8 26 Z" fill="#f2c94c"/>
</svg>
