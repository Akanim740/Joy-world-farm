<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="apple-touch-icon" href="/images/favicon.svg">
  <title>Wholesale Enquiries - Joy World Farm Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <a class="logo" href="/admin/dashboard">
      <span class="logo-icon" aria-hidden="true">🌱</span>
      <span>Joy World Farm Admin</span>
    </a>
    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/products">Products</a>
      <a href="/admin/orders">Orders</a>
      <a href="/admin/delivery">Delivery</a>
      <a href="/admin/enquiries" class="active">Enquiries</a>
      <a href="/" target="_blank">View Site</a>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <main class="admin-content">
    <h1>Wholesale Enquiries</h1>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Business</th><th>Products</th><th>Quantity</th><th>Notes</th><th>Date</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="enquiriesBody">
          <tr><td colspan="9">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    initAdmin('enquiries');
  </script>
</body>
</html>
